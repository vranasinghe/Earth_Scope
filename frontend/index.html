<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Earth Scope — explore NASA Earth science data anywhere on the planet and test whether environmental changes are statistically significant." />
    <meta name="theme-color" content="#0b1422" />
    <script>
      // Apply the saved (or system) theme before first paint, so there is no flash of the wrong theme.
      ;(function () {
        var t = 'dark'
        try {
          var c = localStorage.getItem('es-theme')
          t = c === 'light' || c === 'dark' ? c : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.style.colorScheme = t
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Atkinson+Hyperlegible+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Earth Scope — Discover How Our Planet Is Changing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
